# nginx configuration for the SRI-KO LMS web tier.
#
# Serves the built React bundle, answers a health probe, and (in the
# single-host compose topology) proxies /api to the API container so the
# browser sees one origin and CORS never enters the picture.
#
# Port 8080 rather than 80: the image runs as an unprivileged user, which
# cannot bind a port below 1024.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Health ──────────────────────────────────────────────────────────────
    # Distinct from /, so a load balancer probing health does not pull the
    # whole SPA on every check, and so a probe cannot be satisfied by the SPA
    # fallback returning index.html for a broken path.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── API proxy ───────────────────────────────────────────────────────────
    # Present only when API_UPSTREAM is set at container start (see
    # docker-entrypoint templating in compose). On a split deployment where the
    # frontend is served from a CDN, the browser calls the API directly and
    # this block is unused.
    location /api/ {
        proxy_pass         http://api:5001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Certificate generation and report aggregation are the slow endpoints;
        # 60s is comfortably above their worst observed case and well below the
        # point where a hung request ties up a worker indefinitely.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 10m;   # matches the upload limit in multer
    }

    # ── Static assets ───────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    # A new deployment produces new filenames; nothing needs invalidating.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif)$ {
        expires    30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # index.html is the one file that must not be cached: it is the document
    # that points at the hashed assets, so a stale copy pins the browser to a
    # deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # React Router owns the URL space; any path that is not a file is the
    # application's to resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ────────────────────────────────────────────────────
    # OWASP A05. `always` matters: without it these are omitted on error
    # responses, which is exactly where a clickjacking or sniffing protection
    # is most useful.
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy is deliberately not set here. Vite's production
    # build emits no inline scripts, but the Google Sign-In button and Chart.js
    # both need explicit allowances, and a CSP that is wrong is worse than one
    # that is absent — it breaks the page in a way nobody notices until a user
    # reports it. Set it at the edge once the exact third-party origins are
    # fixed, and verify with report-only first. Tracked in docs/RUNBOOK.md.

    # ── Hardening ───────────────────────────────────────────────────────────
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # Dotfiles are never web content. Without this, a stray .env or .git in the
    # build output is downloadable.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
