# Staging stack — the environment §9.1 requires the demonstration to run on.
#
#   docker compose -f compose/docker-compose.staging.yml up -d
#
# Differences from the development stack, all deliberate:
#
#   * Images are pulled by tag, not built. Staging runs the artefact CI
#     produced, so what is demonstrated is what was tested.
#   * MongoDB is not published to the host. Nothing outside the compose
#     network reaches the database.
#   * Resource limits are set, so one runaway container cannot take the host
#     down with it.
#   * Log rotation is configured. An unrotated json-file driver has filled
#     more staging disks than any application bug.

name: sri-ko-lms-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  mongo:
    image: mongo:7
    <<: *default-restart
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sriko_lms}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
    volumes:
      - mongo-data:/data/db
      - ../docker/mongo/init:/docker-entrypoint-initdb.d:ro
      - mongo-backup:/backup
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    networks: [sriko]

  api:
    image: ${BACKEND_IMAGE:-teamnova/sri-ko-lms-backend}:${IMAGE_TAG:-develop}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DATABASE:-sriko_lms}?authSource=${MONGO_DATABASE:-sriko_lms}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      SESSION_SECRET: ${SESSION_SECRET:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTPS_ENABLE: "false" # TLS terminates at the reverse proxy
    volumes:
      - api-uploads:/app/uploads
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [sriko]

  web:
    image: ${FRONTEND_IMAGE:-teamnova/sri-ko-lms-frontend}:${IMAGE_TAG:-develop}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:8080"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    networks: [sriko]

volumes:
  mongo-data:
  mongo-backup:
  api-uploads:

networks:
  sriko:
    driver: bridge
