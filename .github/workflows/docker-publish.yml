# Publish images to Docker Hub (and GHCR)
#
# The images this builds are the deployable artefact: staging and production
# both run a tag produced here, never a build made on someone's laptop. That
# is the property that makes "it works on staging" mean something about
# production.
#
# Two registries on purpose. Docker Hub is the public, human-findable one and
# is what the deployment hosts pull from. GHCR is authenticated with the
# workflow's own token, needs no secret at all, and keeps working if the Docker
# Hub credentials expire — which they will, at the worst possible moment.
#
# Also callable from another repository:
#
#   jobs:
#     images:
#       uses: TeamNova-SRI-KO-LMS/infrastructure/.github/workflows/docker-publish.yml@main
#       with: { app-ref: develop, image-tag: develop }
#       secrets: inherit

name: Publish Docker Images

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      app-ref:
        description: "Ref of the application repository to build"
        type: string
        default: develop
      image-tag:
        description: "Extra tag to apply"
        type: string
        default: ""
  workflow_call:
    inputs:
      app-ref:
        description: "Ref of the application repository to build"
        type: string
        default: develop
      image-tag:
        description: "Extra tag to apply"
        type: string
        default: ""
    outputs:
      backend-digest:
        description: "Digest of the published backend image"
        value: ${{ jobs.publish.outputs.backend-digest }}
      frontend-digest:
        description: "Digest of the published frontend image"
        value: ${{ jobs.publish.outputs.frontend-digest }}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_REPOSITORY: TeamNova-SRI-KO-LMS/SRI-KO_LMS_MERN
  REGISTRY_GHCR: ghcr.io

jobs:
  publish:
    name: Build & Push (${{ matrix.tier }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR
      id-token: write        # build provenance attestation
      attestations: write
    outputs:
      backend-digest: ${{ steps.collect.outputs.backend }}
      frontend-digest: ${{ steps.collect.outputs.frontend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: backend
            dockerfile: docker/backend.Dockerfile
            hub-image: sri-ko-lms-backend
          - tier: frontend
            dockerfile: docker/frontend.Dockerfile
            hub-image: sri-ko-lms-frontend

    steps:
      - name: Check out the infrastructure
        uses: actions/checkout@v6
        with:
          path: infrastructure

      - name: Check out the application
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ inputs.app-ref || 'develop' }}
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.hub-image }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.hub-image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
          labels: |
            org.opencontainers.image.title=SRI-KO LMS ${{ matrix.tier }}
            org.opencontainers.image.vendor=TeamNova · University of Kelaniya
            org.opencontainers.image.source=https://github.com/${{ env.APP_REPOSITORY }}
            org.opencontainers.image.revision=${{ github.sha }}

      # `type=sha,format=long` gives every build an immutable tag. A rollback
      # then names an exact image rather than "whatever :develop pointed at on
      # Tuesday", which is the difference between a rollback and a guess.
      - name: Build and push ${{ matrix.tier }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: app
          file: infrastructure/${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=publish-${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.tier }}
          provenance: true
          sbom: true
          build-contexts: |
            infra=infrastructure
          build-args: |
            BACKEND_DIR=${{ vars.APP_BACKEND_DIR || 'Backend' }}
            FRONTEND_DIR=${{ vars.APP_FRONTEND_DIR || 'Frontend' }}
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_NODE_ENV=production

      # §8.1 A08 — software and data integrity. An attestation lets a deployment
      # host verify that this image came from this workflow, in this repository,
      # from this commit. Without it, "we pulled the right tag" is trust in DNS
      # and a registry account.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.hub-image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Scanning after the push rather than before is deliberate: the image
      # that gets scanned is byte-for-byte the one that was published, and a
      # finding here is a finding about something real rather than about a
      # local build that may differ.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.hub-image }}@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"      # reported, not blocking: the image is already published

      - name: Record the digest
        id: collect
        run: |
          set -euo pipefail
          echo "${{ matrix.tier }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.tier }} published"
            echo ""
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Docker Hub shows the repository README on the image page. Keeping it in
  # sync from here means the page describes the image rather than being blank,
  # which is what it stays otherwise.
  describe:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - hub-image: sri-ko-lms-backend
            readme: docs/images/backend.md
          - hub-image: sri-ko-lms-frontend
            readme: docs/images/frontend.md
    steps:
      - uses: actions/checkout@v6

      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.hub-image }}
          readme-filepath: ${{ matrix.readme }}
