# Deploy — Production
#
# §7.2: "Merge to main (manual approval) → deploy tagged release to production
# environment."
#
# The manual approval is not a checkbox in this file. It comes from the
# `production` GitHub Environment having required reviewers configured, which
# pauses the job until a named person approves it. That is deliberate: an
# approval encoded in a workflow can be removed in a pull request by the person
# who wants to skip it; an approval encoded in environment protection cannot.
#
# Setup, once:
#   Settings → Environments → New environment → "production"
#     ✓ Required reviewers: the team lead and one other
#     ✓ Wait timer: 0 (the reviewer is the delay)
#     ✓ Deployment branches: Protected branches only
#
# Everything before the approval gate runs first, so the approver is deciding
# about a release that has already been verified rather than about a hope.

name: Deploy — Production

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, e.g. v1.0.0"
        type: string
        required: true
      skip-smoke-test:
        description: "Skip the post-deployment smoke test (emergencies only)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Everything that can be checked before a human is asked ─────────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"

          if ! printf '%s' "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Production deploys a final release only. '${version}' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "numeric=${version#v}"
          } >> "$GITHUB_OUTPUT"

      - name: The tag is on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-list -n 1 "${VERSION}")"
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "::error::${VERSION} is not an ancestor of main. §3.2: production releases are tagged on main."
            exit 1
          fi
          echo "✓ ${VERSION} is on main"

      - name: A GitHub Release exists for this tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "::error::No published release for ${VERSION}. Run the release workflow first — production deploys a release, not a tag."
            exit 1
          fi
          echo "✓ release ${VERSION} exists"

      # If the images are not in the registry, the deployment would fail on the
      # host after the approval, with the old stack already stopped. Checked
      # here instead.
      - name: The images exist in the registry
        env:
          NUMERIC: ${{ steps.version.outputs.numeric }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          missing=0
          for image in sri-ko-lms-backend sri-ko-lms-frontend; do
            reference="${DOCKERHUB_USERNAME}/${image}:${NUMERIC}"
            if docker manifest inspect "${reference}" >/dev/null 2>&1; then
              echo "✓ ${reference}"
            else
              echo "::error::${reference} is not in the registry."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Staging is running the same version
        continue-on-error: true
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          # A warning, not a gate: a hotfix can legitimately go to production
          # without passing through staging. But deploying a version nobody has
          # ever run should be a conscious decision, so it is surfaced here
          # where the approver will read it.
          if [ -z "${STAGING_API_URL:-}" ]; then
            echo "::warning::STAGING_API_URL is not configured, so staging could not be checked."
            exit 0
          fi
          if ! curl -fsS --max-time 10 "${STAGING_API_URL}/health" >/dev/null; then
            echo "::warning::Staging is not answering. This release may never have run anywhere."
          else
            echo "✓ staging is up"
          fi

  # ── Snapshot before touching anything ──────────────────────────────────────
  backup:
    name: Back Up Production
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: production-backup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Runs before the approval gate so that the approver is approving a
      # deployment that already has a restore point. A backup taken after the
      # decision is a backup taken too late.
      - name: Snapshot the database
        env:
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          MONGODB_URI: ${{ secrets.PRODUCTION_MONGODB_URI }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${PROD_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy "${PROD_USER}@${PROD_HOST}" \
            "MONGODB_URI='${MONGODB_URI}' BACKUP_LABEL='pre-${VERSION}' \
             /opt/sri-ko-lms/scripts/backup-mongo.sh"

          rm -f ~/.ssh/id_deploy
          echo "✓ snapshot taken: pre-${VERSION}"

  # ── The gate ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [preflight, backup]
    # This is the manual approval §7.2 requires. The job will not start until a
    # required reviewer on the `production` environment approves it.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Deploy
        id: deploy
        uses: ./
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          user: ${{ secrets.PRODUCTION_USER }}
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
          environment: production
          compose-file: compose/docker-compose.prod.yml
          remote-path: ${{ vars.PRODUCTION_PATH || '/opt/sri-ko-lms' }}
          image-tag: ${{ needs.preflight.outputs.numeric }}
          backend-image: ${{ secrets.DOCKERHUB_USERNAME }}/sri-ko-lms-backend
          frontend-image: ${{ secrets.DOCKERHUB_USERNAME }}/sri-ko-lms-frontend
          env-file: ${{ secrets.PRODUCTION_ENV_FILE }}
          smoke-test-url: ${{ inputs.skip-smoke-test && '' || vars.PRODUCTION_URL }}
          smoke-test-api-url: ${{ vars.PRODUCTION_API_URL }}
          health-timeout: "240"
          rollback-on-failure: "true"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ steps.deploy.outputs.status }}
          TAG: ${{ steps.deploy.outputs.deployed-tag }}
          PREVIOUS: ${{ steps.deploy.outputs.previous-tag }}
          DURATION: ${{ steps.deploy.outputs.duration }}
          URL: ${{ vars.PRODUCTION_URL }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "## Production — ${VERSION}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Status | \`${STATUS:-unknown}\` |"
            echo "| Deployed | \`${TAG:-—}\` |"
            echo "| Previous | \`${PREVIOUS:-none}\` |"
            echo "| Duration | ${DURATION:-?}s |"
            echo "| URL | ${URL:-not configured} |"
            echo ""
            if [ "${STATUS}" = "rolled-back" ]; then
              echo "> The deployment failed its checks and was rolled back automatically."
              echo "> Production is running \`${PREVIOUS}\`. See the uploaded logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── After ──────────────────────────────────────────────────────────────────
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [preflight, deploy]
    if: success()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Ten minutes of periodic checking, because the failures that matter in
      # production are rarely visible in the first thirty seconds: a memory
      # leak, a connection pool that fills, a container that restarts once and
      # then again. A deployment that is green at t+0 and gone at t+5 should
      # not be reported as a success.
      - name: Watch for ten minutes
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail

          failures=0
          for i in $(seq 1 20); do
            if ./scripts/smoke-test.sh "${URL}" "${API_URL}" >/dev/null 2>&1; then
              printf '  %2d/20 ✓\n' "${i}"
            else
              failures=$((failures + 1))
              printf '  %2d/20 ✗\n' "${i}"
            fi
            sleep 30
          done

          echo "Failures: ${failures}/20"
          if [ "${failures}" -gt 2 ]; then
            echo "::error::Production is unstable after deployment (${failures}/20 checks failed). Roll back with scripts/rollback.sh."
            exit 1
          fi

      - name: Record the deployment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          gh release edit "${VERSION}" \
            --notes-file <(
              gh release view "${VERSION}" --json body --jq '.body'
              printf '\n\n---\n\n**Deployed to production:** %s (%s)\n' \
                "$(date -u +'%Y-%m-%d %H:%M UTC')" "${RESULT}"
            ) || echo "::warning::Could not annotate the release."
